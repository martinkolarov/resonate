services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: resonate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resonate
    ports:
      - 5432:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-resonate}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-resonate-dev-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-resonate}
      # Local Docker workaround for MongoDB's TCMalloc incompatibility with Linux 6.19.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - 27017:27017
    volumes:
      - mongodata:/data/db

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resonate
      MINIO_ROOT_PASSWORD: resonate-dev-secret
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - miniodata:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 resonate resonate-dev-secret; do
          sleep 1
        done
        mc mb --ignore-existing local/resonate

volumes:
  postgresdata:
  redisdata:
  mongodata:
  miniodata:
