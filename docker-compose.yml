services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: resonate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resonate
    ports:
      - 5432:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgresdata:
  redisdata:
